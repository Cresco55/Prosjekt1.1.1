[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "klipper"
version = "0.1.0"
description = "Automatisk klipping av GTA 6-strømmer fra streamere som har gitt tillatelse"
requires-python = ">=3.10"
dependencies = [
    "flask>=3.0",
    "numpy>=1.26",
    "pyyaml>=6.0",
    "requests>=2.31",
    "streamlink>=6.8",
]

[project.optional-dependencies]
teksting = ["faster-whisper>=1.0"]
dev = ["pytest>=8"]

[project.scripts]
klipper = "klipper.cli:main"

[tool.setuptools]
packages = ["klipper"]

[tool.pytest.ini_options]
testpaths = ["tests"]
